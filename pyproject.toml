[project]
name = "kriya"
version = "0.1.0"
description = "MLOps, LLMOps, AIOps, AgenticOps and MCPOps, built one day at a time on one service you actually operate."
readme = "README.md"
requires-python = "==3.12.*"
# Principle 7: packages arrive on the day they are first used, pinned with ==, and every pin gets a
# dated row in docs/PACKAGES.md. Day 0 adds no runtime dependency at all — it only installs the
# tools that make the gate work.
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse", "platform_ops"]

[tool.uv]
# On Day 0 there is no importable code yet - `pulse/` and `platform_ops/` hold a .gitkeep and
# nothing else. Without this, every single `uv run` rebuilds and reinstalls an empty wheel, which
# is wasted work and, under OneDrive, an occasional `Access is denied. (os error 5)` while removing
# its own dist-info. `package = false` tells uv to install the dependencies and not the project.
# Verified against docs.astral.sh/uv/concepts/projects/config/ on 2026-08-24.
# FLIP THIS TO TRUE ON DAY 3, when `pulse/` gains real modules that tests need to import.
package = false

# uv installs by hardlinking from its cache into .venv, which is fast and costs no extra disk.
# Inside a cloud-synced folder that can hardlink, this is fine - measured working here 2026-08-24.
# But OneDrive Files On-Demand turns files into placeholders, and hardlinking one of those fails
# half-way through an install with `os error 396`, "the cloud operation cannot be performed on a
# file with incompatible hardlinks" (astral-sh/uv#7906, #9721). Whether it fires depends on the
# sync state of the moment, which is the worst kind of bug: intermittent and environmental.
# Copying costs a few hundred milliseconds and removes the whole class. See Day 0, part 2.2.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["days/*/lab", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "live: hits a real API, model, cluster or database - skipped by default, never run in CI",
    "cluster: needs a running kind cluster - skipped unless KIND_CLUSTER_NAME is set",
    "slow: takes more than a few seconds",
]
