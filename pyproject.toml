[project]
name = "kriya"
version = "0.1.0"
description = "MLOps, LLMOps, AIOps, AgenticOps and MCPOps, built one day at a time on one service you actually operate."
readme = "README.md"
requires-python = "==3.12.*"
# Principle 7: packages arrive on the day they are first used, pinned with ==, and every pin gets a
# dated row in docs/PACKAGES.md. Day 0 adds no runtime dependency at all — it only installs the
# tools that make the gate work.
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse", "platform_ops"]

[tool.uv]
# uv installs by hardlinking from its cache into .venv, which is fast and costs no extra disk.
# A cloud-synced folder (OneDrive, Dropbox, iCloud Drive) refuses hardlinks and the install dies
# half-done with `os error 396`. This repository lives under OneDrive, so: copy.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["days/*/lab", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "live: hits a real API, model, cluster or database - skipped by default, never run in CI",
    "cluster: needs a running kind cluster - skipped unless KIND_CLUSTER_NAME is set",
    "slow: takes more than a few seconds",
]
